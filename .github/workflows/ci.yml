name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew shadowJar

      # The tests run from classes with the full classpath; this is the only place the jar itself runs
      - name: Smoke-test the jar
        run: |
          jar=$(ls build/libs/smali-lsp-*.jar)
          java -jar "$jar" --version
          python3 - "$jar" <<'PY'
          import json, subprocess, sys
          jar = sys.argv[1]
          def framed(*msgs):
              return b"".join(f"Content-Length: {len(b)}\r\n\r\n".encode() + b for b in (json.dumps(m).encode() for m in msgs))
          lsp = subprocess.run(["java", "-jar", jar, "lsp"], input=framed(
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"processId": None, "rootUri": None, "capabilities": {}}},
              {"jsonrpc": "2.0", "id": 2, "method": "shutdown", "params": None},
              {"jsonrpc": "2.0", "method": "exit", "params": None}), capture_output=True, timeout=60)
          assert lsp.returncode == 0 and b'"Smali Language Server"' in lsp.stdout, (lsp.returncode, lsp.stdout[:300], lsp.stderr[-300:])
          mcp = subprocess.run(["java", "-jar", jar, "mcp"], input=b"".join(json.dumps(m).encode() + b"\n" for m in (
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "ci", "version": "0"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}})), capture_output=True, timeout=60)
          assert mcp.returncode == 0 and b'"smali_index"' in mcp.stdout, (mcp.returncode, mcp.stdout[:300], mcp.stderr[-300:])
          print("an LSP and an MCP session over the jar: ok")
          PY

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: smali-lsp
          path: build/libs/smali-lsp-*.jar
          archive: false

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 25 is the release JDK; 17 proves the advertised Java 17 floor stays real
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The three categories are three tasks (unit, regression, integration); --continue runs the rest when one fails
      - name: Tests
        run: ./gradlew check --continue

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (JDK ${{ matrix.java }})
          path: build/test-results/*/*.xml
          reporter: java-junit

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release JAR
        run: ./gradlew shadowJar

      - name: Link to the changelog entry
        id: changelog
        run: |
          heading=$(grep -m1 "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md | sed 's/^## //')
          anchor=$(echo "$heading" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9 -]//g' -e 's/ /-/g')
          echo "url=https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md#${anchor}" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/smali-lsp-*.jar
          body: "Changes: ${{ steps.changelog.outputs.url }}"
